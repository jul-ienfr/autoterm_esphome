#     action:
#       - service: notify.notify
#         data:
#           title: "🔥 Autoterm EMERGENCY"
#           message: "Arrêt d'urgence détecté! Vérifiez le chauffage."
#
#   - alias: "Autoterm: Low Battery Alert"
#     trigger:
#       - platform: numeric_state
#         entity_id: sensor.autoterm_voltage
#         below: 11.0
#     action:
#       - service: notify.notify
#         data:
#           title: "⚠️ Autoterm: Batterie basse"
#           message: "Tension: {{ states('sensor.autoterm_voltage') }}V"

# Boutons utiles pour Home Assistant
button:
  - platform: restart
    name: "Restart ESP"
    icon: "mdi:restart"
  
  - platform: safe_mode
    name: "Safe Mode"
    icon: "mdi:shield-half-full"

# Switchs de diagnostic
switch:
  # Basculer niveau log à chaud
  - platform: template
    name: "Debug Mode"
    icon: "mdi:bug"
    optimistic: true
    turn_on_action:
      - logger.log: "Debug mode activated"
      - lambda: |-
          // Augmente niveau log UART et autoterm
          esp_log_level_set("uart", ESP_LOG_DEBUG);
          esp_log_level_set("autoterm_uart", ESP_LOG_DEBUG);
    turn_off_action:
      - logger.log: "Debug mode deactivated"
      - lambda: |-
          esp_log_level_set("uart", ESP_LOG_INFO);
          esp_log_level_set("autoterm_uart", ESP_LOG_INFO);

  # Mode nuit: limite le ventilateur
  - platform: template
    name: "Night Mode"
    icon: "mdi:weather-night"
    optimistic: true
    turn_on_action:
      - logger.log: "Night mode activated"
      - lambda: |-
          id(autoterm).enable_night_mode(true);
    turn_off_action:
      - logger.log: "Night mode deactivated"
      - lambda: |-
          id(autoterm).enable_night_mode(false);

  # Protection anti-gel
  - platform: template
    name: "Frost Protection"
    icon: "mdi:snowflake"
    optimistic: true
    turn_on_action:
      - logger.log: "Frost protection activated"
      - lambda: |-
          id(autoterm).enable_frost_protection(true);
    turn_off_action:
      - logger.log: "Frost protection deactivated"
      - lambda: |-
          id(autoterm).enable_frost_protection(false);

# Intervalle mise à jour par défaut
interval:
  # Watchdog: log stats CRC toutes les 5min
  - interval: 300s
    then:
      - logger.log:
          level: INFO
          format: "Autoterm running - check CRC stats in logs"
  # Log détaillé des stats toutes les 15min
  - interval: 900s
    then:
      - logger.log:
          level: INFO
          format: "Autoterm stats: uptime check, CRC errors, maintenance status"
      - lambda: |-
          // Feed watchdog
          esp_task_wdt_reset();

# Configuration temps (pour timestamps corrects)
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        - logger.log: "Time synchronized with Home Assistant"

# Deep sleep optionnel (économie quand chauffage éteint)
# Décommenter pour activer le deep sleep après 30 minutes d'inactivité
# deep_sleep:
#   run_duration: 30s
#   sleep_duration: 30min

# ======================================================================
# HARDWARE OPTIONNEL — Documentation pour ajouts futurs
# ======================================================================

# --- CAN Bus Interface ---
# L'Autoterm Air 4D supporte CAN bus 250kbps (plus fiable que UART sur longue distance)
# Nécessite: ESP32 + MCP2515 + TJA1050 (~3€)
# IDs CAN: 0x210 (commandes/status), 0x211 (températures)
# Référence: github.com/AYeropkin/autoterm
#
# sensor:
#   - platform: mcp2515
#     can_id: 0x211
#     id: can_temp_sensor
#     name: "CAN Temperature"
#
# Alternative: utiliser SPI pour lire le MCP2515
# Voir: docs.esphome.io/components/canbus

# --- Capteur CO (Détecteur Monoxyde de Carbone) ---
# CRITIQUE pour la sécurité: les échangeurs fissurés fuient du CO dans l'habitacle
# Nécessite: MQ-7 ou détecteur CO dédié (alarme à 50ppm)
# Seuil d'arrêt: > 35ppm sustained
#
# sensor:
#   - platform: adc
#     pin: GPIO34
#     id: co_sensor_raw
#     name: "CO Sensor Raw"
#     update_interval: 5s
#     filters:
#       - multiply: 3.3  # Conversion ADC
#   - platform: template
#     name: "CO Level"
#     id: co_level
#     unit_of_measurement: "ppm"
#     icon: "mdi:cloud"
#     lambda: |-
#       float raw = id(co_sensor_raw).state;
