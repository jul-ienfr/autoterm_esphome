esphome:
  name: air4d
  friendly_name: Autoterm Air4D

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://jul-ienfr/autoterm_esphome@main
    components: [autoterm_uart]
    refresh: 0s

logger:
  level: DEBUG
  baud_rate: 0  # Evite un conflit avec l'UART

api:
  encryption:
    key: ""

ota:
  - platform: esphome
    password: ""

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Autoterm-4D Fallback Hotspot"
    password: ""

web_server:
  port: 80

captive_portal:

uart:
  - id: uart_panel          # Liaison vers le panneau/afficheur
    rx_pin: 16
    tx_pin: 17
    baud_rate: 9600
    rx_buffer_size: 1024

  - id: uart_heater         # Liaison vers le chauffage
    rx_pin: 22
    tx_pin: 23
    baud_rate: 9600
    rx_buffer_size: 1024

sensor:
  # Exemple : temperature depuis Home Assistant
  - platform: homeassistant
    entity_id: sensor.innenraum_temperature
    id: innenraum_temperature
    internal: true

autoterm_uart:
  uart_display_id: uart_panel
  uart_heater_id: uart_heater

  climate:
    name: "Chauffage Autoterm"
    default_level: 4
    default_temperature: 20
    default_temp_sensor: 2

  internal_temp:
    name: "Temperature interne"
  external_temp:
    name: "Temperature externe"
  heater_temp:
    name: "Temperature chauffage"
  panel_temp:
    name: "Temperature panneau"

  voltage:
    name: "Tension"
    accuracy_decimals: 1

  status_text:
    name: "Statut"

  fan_speed_set:
    name: "Ventilateur consigne"
    unit_of_measurement: "rpm"
  fan_speed_actual:
    name: "Ventilateur reel"
    unit_of_measurement: "rpm"

  pump_frequency:
    name: "Frequence pompe"
    unit_of_measurement: "Hz"

  runtime_hours:
    name: "Heures de fonctionnement"
    accuracy_decimals: 2
  session_runtime:
    name: "Duree session"
    accuracy_decimals: 2

  fan_level:
    name: "Niveau ventilateur"

  panel_temp_override:
    sensor: innenraum_temperature

  temperature_source_select:
    name: "Source temperature"
