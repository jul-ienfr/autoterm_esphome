esphome:
  name: air4d
  friendly_name: Autotherm Air4D
  # Ajout de commentaires pour la maintenance
  comment: "Autoterm Air 4D heater controller - ESP32 with dual UART passthrough"

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    # Optimisation mémoire et stabilité
    sdkconfig_options:
      CONFIG_FREERTOS_UNICORE: y  # Single core = plus stable pour UART intensif
      CONFIG_ESP32_DEFAULT_CPU_FREQ_160: y  # 160MHz suffisant pour UART 9600 baud (économie ~20-30mA)
      # Automatic power management: CPU light-sleep when idle (économie ~50-80mA en veille)
      CONFIG_PM_ENABLE: y
      CONFIG_PM_DFS_INIT_FREQ: 40  # CPU à 40MHz en idle (suffisant pour UART 9600, économie maximale)
      CONFIG_PM_DFS_MAX: 160       # CPU à 160MHz max en charge
      # Watchdog matériel: redémarrage auto si blocage logiciel
      CONFIG_ESP_TASK_WDT_CHECK_IDLE_TASK_CPU0: y
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: 30

# IMPORTANT: Utilise le code local amélioré (avec fix pointeurs + monitoring CRC)
# Structure de dossiers requise:
#   config/
#   ├── air4d.yaml (ce fichier)
#   └── components/
#       └── autoterm_uart/
#           ├── __init__.py
#           ├── autoterm_uart.h (version improved)
#           ├── climate.py
#           └── ...
external_components:
  - source: components  # Charge depuis le dossier local
    components: [autoterm_uart]
    refresh: 0s

# Logger optimisé pour UART intensif
logger:
  level: INFO  # INFO par défaut pour ne pas saturer
  baud_rate: 0  # Désactive UART0 (évite conflit avec nos 2 UARTs)
  logs:
    # Composants non-critiques en mode silencieux
    sensor: WARN
    text_sensor: WARN
    number: WARN
    select: WARN
    # UART et Autoterm en DEBUG pour voir les stats CRC
    uart: INFO
    # autoterm_uart: DEBUG  # Important: logs CRC et diagnostics ici
    climate: INFO

# API Home Assistant avec protection redémarrage
api:
  encryption:
    key: !secret api_encryption_key
  # CRITIQUE: Ne pas redémarrer si Home Assistant est perdu
  # Le chauffage doit fonctionner en autonome même sans Wifi
  reboot_timeout: 0s

# OTA sécurisé
ota:
  - platform: esphome
    password: !secret ota_password
    # Safe mode: rollback automatique après 5 échecs de démarrage
    safe_mode: true
    # Port custom si besoin (évite conflit si plusieurs ESP)
    # port: 3232

# Wifi avec fallback robuste
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Optimisations connexion
  fast_connect: true  # Reconnexion rapide au dernier AP
  power_save_mode: min_modem  # WiFi sleep entre les beacons (économie ~10-20mA)
  # Réduire puissance TX si signal fort (économie ~30mA)
  output_power: 17dB  # Réduit de 20dB à 17dB = économie ~30mA quand le signal est bon

  # Fallback hotspot si Wifi principal inaccessible
  ap:
    ssid: "Autoterm-4D Fallback"
    password: !secret fallback_password

# MQTT pour monitoring externe (Grafana, InfluxDB, alertes)
mqtt:
  broker: 192.168.1.100  # ⚠️ À adapter à ton broker MQTT
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: autoterm
  log_topic: autoterm/debug
  # Discovery automatique pour Home Assistant (redondant avec API ESPHome)
  # discovery: true
  # discovery_prefix: homeassistant

# Web server pour debug local (accessible même si HA down)
# ⚠️ Pour économie maximale: commenter ce bloc (économie ~5-10mA en continu)
# L'API Home Assistant fonctionne sans le web server.
web_server:
  port: 80
  # Authentification recommandée en production
  auth:
    username: !secret web_username
    password: !secret web_password
  # Logs en temps réel via web
  log: true

captive_portal:

# Configuration UART optimisée
uart:
  # UART Panel (Display/Télécommande)
  - id: uart_panel
    # ATTENTION: Vérifie ton modèle ESP32
    # ESP32-WROOM (standard): RX=16 TX=17 OK ✅
    # ESP32-WROVER (avec PSRAM): RX=16 TX=17 DANGER ❌ (utilise 25/26 à la place)
    rx_pin: GPIO16
    tx_pin: GPIO17
    baud_rate: 9600
    # Buffer agrandi pour éviter overflow (protocole bavard)
    rx_buffer_size: 1024
    # Paramètres série Autoterm
    parity: NONE
    stop_bits: 1
    data_bits: 8
    # Debug: décommenter pour voir les bytes bruts
    # debug:
    #   direction: BOTH
    #   dummy_receiver: false

  # UART Heater (Connexion directe chaudière)
  - id: uart_heater
    rx_pin: GPIO22
    tx_pin: GPIO23
    baud_rate: 9600
    rx_buffer_size: 1024
    parity: NONE
    stop_bits: 1
    data_bits: 8

# Capteur température Home Assistant (injecté dans le chauffage)
sensor:
  - platform: homeassistant
    entity_id: sensor.innenraum_temperature
    id: innenraum_temperature
    internal: true  # Caché dans HA (évite duplication)
    # Filtres pour stabiliser la valeur
    filters:
      - filter_out: nan  # Ignore valeurs invalides
      - sliding_window_moving_average:  # Moyenne glissante
          window_size: 5
          send_every: 1
      - heartbeat: 60s  # Force mise à jour toutes les 60s minimum
    # Callback pour debug
    on_value:
      then:
        - logger.log:
            format: "HA Temperature received: %.1f°C"
            args: ['x']
            level: DEBUG

  # Stats système ESP32 (utile pour monitoring)
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    
  - platform: uptime
    name: "Uptime"
    update_interval: 60s

# Configuration Autoterm UART (améliorée)
autoterm_uart:
  # IDs UART
  uart_display_id: uart_panel
  uart_heater_id: uart_heater
  
  # Composant Climate (thermostat HA)
  climate:
    name: "Heating"
    # Niveau par défaut (1-9, 4 = équilibré)
    default_level: 4
    # Température cible par défaut
    default_temperature: 20°C
    # Source température par défaut
    # 1=Intern, 2=Panel, 3=Extern, 4=Home Assistant
    default_temp_sensor: 4  # Utilise HA par défaut (innenraum_temperature)
    # Hystérésis thermostat (évite oscillations)
    thermostat_hysteresis_on: 2.0   # Démarre si T < (cible - 2°C)
    thermostat_hysteresis_off: 1.0  # Arrête si T > (cible + 1°C)
  
  # Température interne chaudière
  internal_temp:
    name: "Internal Temperature"
    accuracy_decimals: 1
    filters:
      - filter_out: nan
  
  # Température sonde externe (si connectée)
  external_temp:
    name: "External Temperature"
    accuracy_decimals: 1
    filters:
      - filter_out: nan
  
  # Température chambre combustion
  heater_temp:
    name: "Heater Temperature"
    accuracy_decimals: 0
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    filters:
      - filter_out: nan
  
  # Température panel/télécommande
  panel_temp:
    name: "Panel Temperature"
    accuracy_decimals: 1
    filters:
      - filter_out: nan
  
  # Tension batterie/alimentation
  voltage:
    name: "Voltage"
    accuracy_decimals: 1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    # Alerte si tension critique
    on_value_range:
      - below: 11.5
        then:
          - logger.log:
              level: ERROR
              format: "ALERTE: Tension batterie critique: %.1fV"
              args: ['x']
  
  # Statut texte (plus lisible que le code)
  status_text:
    name: "Status Text"
    icon: "mdi:information-outline"
  
  # Vitesse ventilateur (consigne)
  fan_speed_set:
    name: "Fan RPM Set"
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    state_class: measurement
  
  # Vitesse ventilateur (réelle)
  fan_speed_actual:
    name: "Fan RPM Actual"
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    state_class: measurement
  
  # Fréquence pompe diesel
  pump_frequency:
    name: "Pump Frequency"
    unit_of_measurement: "Hz"
    accuracy_decimals: 2
    state_class: measurement

  # Estimation consommation carburant (L/h)
  fuel_consumption:
    name: "Fuel Consumption"
    unit_of_measurement: "L/h"
    accuracy_decimals: 2
    state_class: measurement
    icon: "mdi:gas-station"

  # Consommation totale cumulée (persistée en mémoire ESP32)
  total_fuel_consumed:
    name: "Total Fuel Consumed"
    unit_of_measurement: "L"
    accuracy_decimals: 2
    state_class: total_increasing
    device_class: gas
    icon: "mdi:gas-station-outline"

  # Consommation carburant du jour (reset à minuit)
  daily_fuel_consumed:
    name: "Daily Fuel Consumed"
    unit_of_measurement: "L"
    accuracy_decimals: 2
    state_class: measurement
    icon: "mdi:gas-station"

  # Efficacité combustion (estimation en %)
  combustion_efficiency:
    name: "Combustion Efficiency"
    unit_of_measurement: "%"
    accuracy_decimals: 1
    state_class: measurement
    icon: "mdi:fire"

  # Delta-T échangeur (T_échappement - T_air_ambiant)
  delta_t:
    name: "Delta T Exchanger"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    icon: "mdi:thermometer-plus"

  # Temps d'allumage (secondes)
  ignition_time:
    name: "Ignition Time"
    unit_of_measurement: "s"
    accuracy_decimals: 1
    state_class: measurement
    icon: "mdi:timer-sand"

  # Diagnostics démarrage
  boot_count:
    name: "Boot Count"
    icon: "mdi:counter"
    accuracy_decimals: 0
    state_class: total_increasing

  free_heap:
    name: "Free Heap"
    unit_of_measurement: "B"
    icon: "mdi:memory"
    accuracy_decimals: 0
    state_class: measurement

  # Alertes maintenance (1 = maintenance requise)
  maintenance_oil:
    name: "Maintenance: Oil Change"
    icon: "mdi:oil"
    device_class: problem

  maintenance_filter:
    name: "Maintenance: Filter Clean"
    icon: "mdi:air-filter"
    device_class: problem

  maintenance_glow:
    name: "Maintenance: Glow Plug"
    icon: "mdi:lightning-bolt"
    device_class: problem

  # Score d'usure brûleur (100% = neuf, <70% = nettoyage nécessaire)
  wear_score:
    name: "Burner Wear Score"
    unit_of_measurement: "%"
    icon: "mdi:gauge"
    accuracy_decimals: 0
    state_class: measurement

  # Économie carburant (% de temps près de la cible)
  fuel_economy_savings:
    name: "Fuel Economy Savings"
    unit_of_measurement: "%"
    icon: "mdi:leaf"
    accuracy_decimals: 1
    state_class: measurement

  # Température prédite (basée sur les patterns horaires)
  predicted_temp:
    name: "Predicted Temperature"
    unit_of_measurement: "°C"
    icon: "mdi:thermometer-auto"
    accuracy_decimals: 1
    state_class: measurement
  
  # Compteur heures fonctionnement (persisté en mémoire)
  runtime_hours:
    name: "Operating hours"
    accuracy_decimals: 2
    unit_of_measurement: "h"
    icon: "mdi:clock-outline"
    state_class: total_increasing
    device_class: duration
  
  # Durée session actuelle
  session_runtime:
    name: "Duration session"
    accuracy_decimals: 2
    unit_of_measurement: "h"
    icon: "mdi:timer-outline"
    state_class: measurement
  
  # Contrôle niveau ventilateur manuel
  fan_level:
    name: "Fan Level"
    icon: "mdi:fan"
  
  # Override température panel avec capteur HA
  panel_temp_override:
    sensor: innenraum_temperature
  
  # Sélecteur source température
  temperature_source_select:
    name: "Temperature Source"
    icon: "mdi:thermometer-lines"

  # Protection anti-gel: démarre le chauffage si T ext < 2°C
  frost_protection: true
  frost_protection_temp: 2.0

  # Mode nuit: limite le ventilateur pour moins de bruit
  night_mode: false
  night_mode_max_level: 3

  # PID controller: régulation fine au lieu de on/off simple
  # Module la puissance proportionnellement à l'erreur de température
  # Réduit les oscillations et économise carburant
  pid_mode: false  # Activer pour PID (désactiver = hystérésis classique)
  pid_kp: 2.0     # Gain proportionnel (réactivité)
  pid_ki: 0.5     # Gain intégral (corrige l'erreur statique)
  pid_kd: 0.1     # Gain dérivé (anticipe les changements)

  # ===== ECO-ADAPTIVE MODE =====
  # Mode adaptatif continu: module la puissance sans cycles on/off
  # Réduit carburant, électricité et usure bougie de préchauffage
  # Recommandé comme mode principal (remplace PID et hystérésis)
  eco_adaptive: false  # Activer pour mode adaptatif
  eco_kp: 1.5          # Proportionnel (plus doux que PID classique)
  eco_ki: 0.3          # Intégral (apprentissage lent de la pièce)
  eco_kd: 0.2          # Dérivée (anticipation des changements)
  eco_min_level: 1     # Niveau minimum (jamais 0 = arrêt complet)
  eco_max_level: 9     # Niveau maximum
  eco_deadband: 0.3    # Zone morte ±0.3°C = pas de changement de niveau
  eco_overshoot_predict: true  # Feed-forward: réduit la puissance quand la T monte vite
  max_pump_freq: 5.0  # Hz (max 6, réduit à 5 pour moins de stress mécanique pompe)

  # Seuils maintenance configurables (en heures)
  maintenance_oil_hours: 500.0     # Changement huile
  maintenance_filter_hours: 200.0  # Nettoyage filtre
  maintenance_glow_hours: 1000.0   # Remplacement bougie

  # Mode économie carburant: suit le temps passé près de la cible
  fuel_economy: true  # Active par défaut (tracking sans impact sur les performances)
  fuel_economy_reactive: false  # Réduit proactivement la puissance quand proche de la cible

  # Prédiction intelligente: apprend les patterns de température par heure
  prediction: true  # Active par défaut (apprend les patterns pour préchauffage)

  # Light sleep: réduit la consommation quand le chauffage est éteint
  light_sleep: false  # Activer pour économie d'énergie

  # ===== EXTENDED PROTOCOL =====
  # Mode diagnostic: active le flux de télémétrie avancé (72 octets/s)
  # Inclut: glow plug current, chamber temp, board temp, fault codes
  # ATTENTION: génère beaucoup de données UART, activer en diagnostic uniquement
  diagnostic_mode: false

  # Capteurs du mode diagnostic
  glow_plug_current:
    name: "Glow Plug Current"
    unit_of_measurement: "%"
    icon: "mdi:lightning-bolt"
    accuracy_decimals: 1
    state_class: measurement

  chamber_temp:
    name: "Combustion Chamber Temp"
    unit_of_measurement: "°C"
    icon: "mdi:fire"
    accuracy_decimals: 1
    state_class: measurement

  board_temp:
    name: "ECU Board Temp"
    unit_of_measurement: "°C"
    icon: "mdi:thermometer"
    accuracy_decimals: 1
    state_class: measurement

  # Code d'erreur (byte 2 de la réponse status)
  error_code:
    name: "Error Code"
    icon: "mdi:alert-circle"
    accuracy_decimals: 0
    state_class: measurement

  error_text:
    name: "Error Text"
    icon: "mdi:alert"

  # Version firmware (requêtée au démarrage)
  firmware_version:
    name: "Firmware Version"
    icon: "mdi:information"

  # État du mode adaptatif
  eco_mode_status:
    name: "Eco-Adaptive Status"
    icon: "mdi:thermostat-auto"

  # Historique (heures totales, démarrages, 3 dernières erreurs)
  total_starts:
    name: "Total Start Cycles"
    icon: "mdi:counter"
    accuracy_decimals: 0
    state_class: total_increasing

  error_log:
    name: "Error Log"
    icon: "mdi:file-document-alert"

  # ===== ECO-ADAPTIVE SENSORS =====
  eco_adaptive_level:
    name: "Eco-Adaptive Level"
    icon: "mdi:thermostat"
    accuracy_decimals: 0
    state_class: measurement

  eco_adaptive_error:
    name: "Eco-Adaptive Error"
    unit_of_measurement: "°C"
    icon: "mdi:math-difference"
    accuracy_decimals: 1
    state_class: measurement

  eco_power_efficiency:
    name: "Power Efficiency"
    unit_of_measurement: "%"
    icon: "mdi:leaf"
    accuracy_decimals: 0
    state_class: measurement

  # Boutons d'action
  unlock_button:
    name: "Clear Lockout"
    icon: "mdi:key-variant"

  prime_pump_button:
    name: "Prime Fuel Pump"
    icon: "mdi:water-pump"
    prime_frequency: 1  # Hz (1-255)

  # Bouton snapshot complet (demande version + historique + status + diagnostic)
  status_report_button:
    name: "Status Report"
    icon: "mdi:file-document-edit"

  # CO sensor (SAVES LIVES — carbon monoxide detection)
  # ⚠️ Requiert capteur MQ-7 ou détecteur CO dédié sur GPIO34
  # Arrêt urgence si > 35ppm pendant 3 lectures consécutives
  # Décommenter et configurer le capteur ADC ci-dessous
  # co_level:
  #   name: "CO Level"
  #   device_class: carbon_monoxide

  # GPS altitude (depuis HA Companion App — pas de hardware nécessaire)
  # Compense automatiquement la densité de l'air en altitude
  # À 2000m: max level réduit de 9 à 7 (évite suie et combustion riche)
  # ⚠️ Nécessite HA Companion App avec GPS activé sur le téléphone
  # gps_altitude:
  #   name: "GPS Altitude"

# Automatisations utiles
# Exemple: Notification si erreur CRC élevée
text_sensor:
  - platform: template
    name: "Autoterm Status"
    id: autoterm_status_combined
    icon: "mdi:fire"
    # Mise à jour toutes les 30s avec infos clés
    update_interval: 30s
    lambda: |-
      if (id(autoterm).get_status_text_sensor()) {
        return id(autoterm).get_status_text_sensor()->state;
      }
      return {"Initializing..."};

  # Raison du dernier redémarrage ESP32
  # (géré par le composant autoterm_uart, pas un template)
  # Le capteur reset_reason est publié automatiquement au démarrage

# Automatisations Home Assistant: notifications sur erreurs critiques
# Activer dans HA: Settings → Automations → créer une automation basée sur ces triggers
# Ou décommenter les notifies ci-dessous si intégration push configurée
# automation:
