packages:
  common: !include air4d_common.yaml

esphome:
  name: air4d
  friendly_name: Autotherm Air4D

esp32:
  board: esp32dev
  framework:
    type: arduino

# Logger en DEBUG complet pour diagnostic
logger:
  level: DEBUG
  baud_rate: 0

api:
  encryption:
    key: "DJih/n8wOct7DXASAq2DYc3WgU81j4G9wYr+HS/uZ7k="
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: "821a52851d4645f113fffc1c61404003"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  fast_connect: true
  power_save_mode: none
  ap:
    ssid: "Autoterm-4D Fallback"
    password: !secret fallback_password

web_server:
  port: 80
  auth:
    username: !secret web_username
    password: !secret web_password
  log: true

captive_portal:

# UART hérité de air4d_common.yaml (GPIO16/17 + GPIO22/23, 9600 8N1)

sensor:
  - platform: homeassistant
    entity_id: sensor.innenraum_temperature
    id: innenraum_temperature
    internal: true
    filters:
      - filter_out: nan
      - sliding_window_moving_average:
          window_size: 5
          send_every: 1
      - heartbeat: 60s

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    update_interval: 60s

autoterm_uart:
  uart_display_id: uart_panel
  uart_heater_id: uart_heater

  climate:
    name: "Heating"
    default_level: 4
    default_temperature: 20°C
    default_temp_sensor: 4
    thermostat_hysteresis_on: 2.0
    thermostat_hysteresis_off: 1.0

  internal_temp:
    name: "Internal Temperature"
    accuracy_decimals: 1
    filters:
      - filter_out: nan

  external_temp:
    name: "External Temperature"
    accuracy_decimals: 1
    filters:
      - filter_out: nan

  heater_temp:
    name: "Heater Temperature"
    accuracy_decimals: 0
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    filters:
      - filter_out: nan

  panel_temp:
    name: "Panel Temperature"
    accuracy_decimals: 1
    filters:
      - filter_out: nan

  voltage:
    name: "Voltage"
    accuracy_decimals: 1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    on_value_range:
      - below: 11.5
        then:
          - logger.log:
              level: ERROR
              format: "ALERTE: Tension batterie critique: %.1fV"
              args: ['x']

  status_text:
    name: "Status Text"
    icon: "mdi:information-outline"

  fan_speed_set:
    name: "Fan RPM Set"
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    state_class: measurement

  fan_speed_actual:
    name: "Fan RPM Actual"
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    state_class: measurement

  pump_frequency:
    name: "Pump Frequency"
    unit_of_measurement: "Hz"
    accuracy_decimals: 2
    state_class: measurement

  runtime_hours:
    name: "Operating hours"
    accuracy_decimals: 2
    unit_of_measurement: "h"
    icon: "mdi:clock-outline"
    state_class: total_increasing
    device_class: duration

  session_runtime:
    name: "Duration session"
    accuracy_decimals: 2
    unit_of_measurement: "h"
    icon: "mdi:timer-outline"
    state_class: measurement

  fan_level:
    name: "Fan Level"
    icon: "mdi:fan"

  panel_temp_override:
    sensor: innenraum_temperature

  temperature_source_select:
    name: "Temperature Source"
    icon: "mdi:thermometer-lines"

button:
  - platform: restart
    name: "Restart ESP"
    icon: "mdi:restart"

  - platform: safe_mode
    name: "Safe Mode"
    icon: "mdi:shield-half-full"

switch:
  - platform: template
    name: "Debug Mode"
    icon: "mdi:bug"
    optimistic: true
    turn_on_action:
      - logger.log: "Debug mode activated"
      - lambda: |-
          esp_log_level_set("uart", ESP_LOG_DEBUG);
          esp_log_level_set("autoterm_uart", ESP_LOG_DEBUG);
    turn_off_action:
      - logger.log: "Debug mode deactivated"
      - lambda: |-
          esp_log_level_set("uart", ESP_LOG_INFO);
          esp_log_level_set("autoterm_uart", ESP_LOG_INFO);

interval:
  - interval: 300s
    then:
      - logger.log:
          level: INFO
          format: "Autoterm running - check CRC stats in logs"

time:
  - platform: homeassistant
    id: homeassistant_time
    on_time_sync:
      then:
        - logger.log: "Time synchronized with Home Assistant"
